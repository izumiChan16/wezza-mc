name: Validate server repository

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install pinned Packwiz
        run: go install github.com/packwiz/packwiz@dfd8b68a4796c763e25bad50265ea1f1233e24f1

      - name: Refresh and validate Packwiz
        run: |
          cd pack
          "$(go env GOPATH)/bin/packwiz" refresh
          cd ..
          python3 tools/validate_pack.py pack
          git diff --exit-code -- pack

      - name: Validate scripts and Compose
        run: |
          bash -n mcctl
          python3 -m py_compile tools/validate_pack.py tools/release_pack.py
          python3 tools/release_pack.py safety --pack-dir pack
          python3 tools/release_pack.py release-check --pack-dir pack \
            --release site/release.json
          cp .env.example .env
          cp secrets/aws_credentials.example secrets/aws_credentials
          printf 'ci-only\n' > secrets/rcon_password.txt
          printf 'ci-only\n' > secrets/restic_password.txt
          docker compose config --quiet

      - name: Build and verify standard MRPACK
        run: |
          mkdir -p dist
          cd pack
          "$(go env GOPATH)/bin/packwiz" modrinth export \
            --output ../dist/wezza-mc-ci.mrpack
          cd ..
          python3 tools/release_pack.py verify \
            --pack-dir pack --mrpack dist/wezza-mc-ci.mrpack
