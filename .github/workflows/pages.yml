name: Publish Packwiz to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pack/**"
      - "site/**"
      - "tools/release_pack.py"
      - "tools/validate_pack.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false

      - name: Install pinned Packwiz
        run: go install github.com/packwiz/packwiz@dfd8b68a4796c763e25bad50265ea1f1233e24f1

      - name: Validate source manifest
        run: |
          cd pack
          "$(go env GOPATH)/bin/packwiz" refresh
          cd ..
          python3 tools/validate_pack.py pack
          git diff --exit-code -- pack

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Assemble static site and standard MRPACK
        run: |
          mkdir -p public/downloads
          cp -a pack/. public/
          rm -f public/.packwizignore public/redistribution.toml
          cp site/index.html site/updates.html site/release.json public/
          python3 tools/validate_pack.py pack --json-output public/mods.json
          python3 tools/release_pack.py safety --pack-dir pack
          python3 tools/release_pack.py release-check --pack-dir pack \
            --release site/release.json
          PACK_VERSION="$(python3 tools/release_pack.py version --pack-dir pack)"
          cd pack
          "$(go env GOPATH)/bin/packwiz" modrinth export \
            --output "../public/downloads/wezza-mc-${PACK_VERSION}.mrpack"
          cd ..
          cp "public/downloads/wezza-mc-${PACK_VERSION}.mrpack" \
            public/downloads/wezza-mc-latest.mrpack
          python3 tools/release_pack.py verify --pack-dir pack \
            --mrpack "public/downloads/wezza-mc-${PACK_VERSION}.mrpack"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
